<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded App Icon Background: Slate / Deep Indigo -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  
  <!-- Outer Ears -->
  <circle cx="21" cy="22" r="7" fill="#ffffff"/>
  <circle cx="43" cy="22" r="7" fill="#ffffff"/>
  <!-- Inner Ears (Subtle Slate Tint) -->
  <circle cx="21" cy="22" r="3.5" fill="#e2e8f0"/>
  <circle cx="43" cy="22" r="3.5" fill="#e2e8f0"/>
  
  <!-- Bear Head -->
  <ellipse cx="32" cy="38" rx="20" ry="17" fill="#ffffff"/>
  
  <!-- Eyes -->
  <circle cx="25" cy="36" r="2.2" fill="#0f172a"/>
  <circle cx="39" cy="36" r="2.2" fill="#0f172a"/>
  
  <!-- Snout Area -->
  <ellipse cx="32" cy="43.5" rx="8" ry="6" fill="#f1f5f9"/>
  
  <!-- Nose -->
  <path d="M 29.5 41 C 30.5 40.5, 33.5 40.5, 34.5 41 C 35 42, 33 44.5, 32 44.5 C 31 44.5, 29 42, 29.5 41 Z" fill="#0f172a"/>
  
  <!-- Subtle Mouth -->
  <path d="M 32 44.5 L 32 46.5" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
</svg>
